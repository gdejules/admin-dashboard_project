<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="dashboard">
      <div class="sidebar">
        <div class="logo">Dashboard</div>
        <div class="menu">
          <ul class="main-menu">
            <li>Home</li>
            <li>Profile</li>
            <li>Messages</li>
            <li>History</li>
            <li>Tasks</li>
            <li>Communities</li>
          </ul>
        </div>
        <div class="support">
          <ul class="support-menu">
            <li>Settings</li>
            <li>Support</li>
            <li>Privacy</li>
          </ul>
        </div>
      </div>
      <div class="main-content">
        <div class="header">
          <div class="search"></div>
          <div class="notification"></div>
          <div class="user-info">
            <div class="small-profile"></div>
            <div class="user-name">Gde Jules</div>
          </div>
          <div class="title-bar">
            <div class="big-profile"></div>
            <div class="greeting"></div>
            <h1>Gde Jules (@jules)</h1>
          </div>
          <div class="action-buttons"></div>
        </div>
        <div class="projects">
          <div class="your-projects">Your Projects</div>
          <div class="container">
            <div class="project">
              <div class="title"></div>
              <div class="desc"></div>
              <div class="btns"></div>
            </div>
            <div class="project">
              <div class="title"></div>
              <div class="desc"></div>
              <div class="btns"></div>
            </div>
            <div class="project">
              <div class="title"></div>
              <div class="desc"></div>
              <div class="btns"></div>
            </div>
            <div class="project">
              <div class="title"></div>
              <div class="desc"></div>
              <div class="btns"></div>
            </div>
            <div class="project">
              <div class="title"></div>
              <div class="desc"></div>
              <div class="btns"></div>
            </div>
            <div class="project">
              <div class="title"></div>
              <div class="desc"></div>
              <div class="btns"></div>
            </div>
          </div>
        </div>
        <div class="announcements">
          <div class="announcements-title">Announcements</div>
          <div class="container">
            <div class="announcement">
              <div class="announcement-title"></div>
              <div class="announcement-content"></div>
            </div>
            <div class="announcement">
              <div class="announcement-title"></div>
              <div class="announcement-content"></div>
            </div>
            <div class="announcement">
              <div class="announcement-title"></div>
              <div class="announcement-content"></div>
            </div>
          </div>
        </div>
        <div class="trending">
          <div class="trending-title">Trending</div>
          <div class="container">
            <div class="user">
              <div class="small-profile"></div>
              <div class="profile-name"></div>
              <div class="project-name"></div>
            </div>
            <div class="user">
              <div class="small-profile"></div>
              <div class="profile-name"></div>
              <div class="project-name"></div>
            </div>
            <div class="user">
              <div class="small-profile"></div>
              <div class="profile-name"></div>
              <div class="project-name"></div>
            </div>
            <div class="user">
              <div class="small-profile"></div>
              <div class="profile-name"></div>
              <div class="project-name"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
